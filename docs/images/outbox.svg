<?xml version="1.0" standalone="no"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg version="1.1" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 600" width="1960" height="1200" font-family="Excalifont, Xiaolai, sans-serif, Segoe UI Emoji">
  <defs>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1971c2"/>
    </marker>
    <marker id="arrow-orange" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#f08c00"/>
    </marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2f9e44"/>
    </marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e03131"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#495057"/>
    </marker>
  </defs>

  <!-- Title -->
  <text x="490" y="40" font-size="28" fill="#1971c2" text-anchor="middle" font-weight="bold">Outbox Lifecycle</text>
  <text x="490" y="65" font-size="16" fill="#495057" text-anchor="middle">enqueue first → persist → drain on every plausible trigger</text>

  <!-- ===================== Top row: Triggers ===================== -->
  <rect x="290" y="100" width="400" height="70" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="490" y="125" font-size="15" fill="#1971c2" text-anchor="middle" font-weight="bold">Triggers → dispatcher.flush()</text>
  <text x="490" y="145" font-size="12" fill="#1971c2" text-anchor="middle">cold start  ·  connectivity restored</text>
  <text x="490" y="163" font-size="12" fill="#1971c2" text-anchor="middle">app resumed  ·  post-enqueue</text>

  <!-- Trigger arrow → Dispatcher -->
  <line x1="615" y1="170" x2="615" y2="251" stroke="#1971c2" stroke-width="2" stroke-dasharray="4 5" marker-end="url(#arrow-blue)"/>
  <text x="625" y="215" font-size="11" fill="#1971c2">flush()</text>

  <!-- ===================== Middle row: pipeline ===================== -->
  <!-- Feature -->
  <rect x="40" y="255" width="160" height="90" rx="10" fill="#e7f5ff" stroke="#1971c2" stroke-width="2"/>
  <text x="120" y="285" font-size="18" fill="#1971c2" text-anchor="middle" font-weight="bold">Feature</text>
  <text x="120" y="307" font-size="13" fill="#1971c2" text-anchor="middle">creates Action</text>
  <text x="120" y="325" font-size="13" fill="#1971c2" text-anchor="middle">repository.add()</text>
  <text x="80" y="225" font-size="14" fill="#1971c2" font-weight="bold">PRODUCER</text>

  <!-- Repository -->
  <rect x="245" y="255" width="180" height="90" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <text x="335" y="285" font-size="18" fill="#f08c00" text-anchor="middle" font-weight="bold">Repository</text>
  <text x="335" y="307" font-size="13" fill="#f08c00" text-anchor="middle">SharedPreferences /</text>
  <text x="335" y="325" font-size="13" fill="#f08c00" text-anchor="middle">SQLite / Hive</text>
  <text x="262" y="225" font-size="14" fill="#f08c00" font-weight="bold">DURABLE QUEUE</text>
  <text x="262" y="358" font-size="11" fill="#495057" font-style="italic">survives process death</text>

  <!-- Dispatcher -->
  <rect x="525" y="255" width="180" height="90" rx="10" fill="#f1f3f5" stroke="#495057" stroke-width="2"/>
  <text x="615" y="285" font-size="18" fill="#495057" text-anchor="middle" font-weight="bold">Dispatcher</text>
  <text x="615" y="307" font-size="13" fill="#495057" text-anchor="middle">getAll() · route by type</text>
  <text x="615" y="325" font-size="13" fill="#495057" text-anchor="middle">catch · increment</text>
  <text x="555" y="225" font-size="14" fill="#495057" font-weight="bold">DRAINER</text>
  <text x="555" y="358" font-size="11" fill="#495057" font-style="italic">in-flight mutex (single flush)</text>

  <!-- Handlers (single box; per-feature) -->
  <rect x="800" y="255" width="160" height="90" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="880" y="285" font-size="18" fill="#2f9e44" text-anchor="middle" font-weight="bold">Handler</text>
  <text x="880" y="307" font-size="12" fill="#2f9e44" text-anchor="middle">per-feature, per-type</text>
  <text x="880" y="325" font-size="12" fill="#495057" text-anchor="middle" font-style="italic">deserialize · call API</text>
  <text x="800" y="180" font-size="14" fill="#2f9e44" font-weight="bold">REPLAYER</text>
  <text x="800" y="358" font-size="11" fill="#495057" font-style="italic">decides retry vs give-up</text>

  <!-- Pipeline arrows (left → right) -->
  <line x1="200" y1="300" x2="241" y2="300" stroke="#1971c2" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="207" y="293" font-size="11" fill="#1971c2">add()</text>

  <line x1="425" y1="290" x2="521" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="438" y="282" font-size="11" fill="#495057">getAll()</text>

  <line x1="705" y1="290" x2="796" y2="290" stroke="#495057" stroke-width="2" marker-end="url(#arrow-grey)"/>
  <text x="715" y="282" font-size="11" fill="#495057">handle(record)</text>

  <!-- ===================== Bottom row: outcomes ===================== -->
  <text x="800" y="395" font-size="14" fill="#495057" font-weight="bold">OUTCOMES (handler decides)</text>

  <!-- success -->
  <rect x="800" y="410" width="160" height="65" rx="10" fill="#d3f9d8" stroke="#2f9e44" stroke-width="2"/>
  <text x="880" y="435" font-size="14" fill="#2f9e44" text-anchor="middle" font-weight="bold">success</text>
  <text x="880" y="455" font-size="12" fill="#2f9e44" text-anchor="middle">repository.remove()</text>
  <text x="880" y="470" font-size="11" fill="#495057" text-anchor="middle" font-style="italic">2xx</text>

  <!-- permanent -->
  <rect x="800" y="490" width="160" height="65" rx="10" fill="#fff3bf" stroke="#f08c00" stroke-width="2"/>
  <text x="880" y="515" font-size="14" fill="#f08c00" text-anchor="middle" font-weight="bold">permanent</text>
  <text x="880" y="535" font-size="12" fill="#f08c00" text-anchor="middle">log + remove</text>
  <text x="880" y="550" font-size="11" fill="#495057" text-anchor="middle" font-style="italic">404 · 409 · 422</text>

  <!-- transient -->
  <rect x="525" y="450" width="245" height="65" rx="10" fill="#ffe3e3" stroke="#e03131" stroke-width="2"/>
  <text x="647" y="475" font-size="14" fill="#e03131" text-anchor="middle" font-weight="bold">transient → rethrow</text>
  <text x="647" y="495" font-size="12" fill="#e03131" text-anchor="middle">offline · 5xx · timeout · 401</text>
  <text x="647" y="510" font-size="11" fill="#495057" text-anchor="middle" font-style="italic">leave record on disk</text>

  <!-- Handler → outcome arrows -->
  <line x1="880" y1="345" x2="880" y2="406" stroke="#2f9e44" stroke-width="2" marker-end="url(#arrow-green)"/>
  <line x1="900" y1="345" x2="900" y2="486" stroke="#f08c00" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <line x1="800" y1="345" x2="700" y2="446" stroke="#e03131" stroke-width="2" marker-end="url(#arrow-red)"/>

  <!-- Retry loop: transient outcome → dispatcher increments → next flush -->
  <path d="M 525 480 Q 470 480 480 380 Q 490 350 525 345" stroke="#e03131" stroke-width="2" stroke-dasharray="4 5" fill="none" marker-end="url(#arrow-red)"/>
  <text x="395" y="430" font-size="12" fill="#e03131" font-weight="bold">retry on next trigger</text>
  <text x="395" y="446" font-size="11" fill="#495057" font-style="italic">attemptCount++</text>

  <!-- ===================== HTTP + Idempotency-Key annotation ===================== -->
  <!-- Server is intentionally off-canvas (the diagram's job is the on-device
       lifecycle). We just label what the Handler does over the wire. -->
  <rect x="785" y="200" width="190" height="48" rx="8" fill="#e7f5ff" stroke="#1971c2" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="880" y="219" font-size="12" fill="#1971c2" text-anchor="middle" font-weight="bold">→ HTTP API</text>
  <text x="880" y="234" font-size="11" fill="#495057" text-anchor="middle">Idempotency-Key in header</text>
  <text x="880" y="246" font-size="10" fill="#495057" text-anchor="middle" font-style="italic">(server dedupes retries)</text>
  <line x1="880" y1="248" x2="880" y2="251" stroke="#1971c2" stroke-width="2" stroke-dasharray="2 3" marker-end="url(#arrow-blue)"/>

  <!-- ===================== Why-this-matters callout (bottom-left) ===================== -->
  <rect x="40" y="450" width="305" height="100" rx="10" fill="#f8f9fa" stroke="#495057" stroke-width="2" stroke-dasharray="4 5"/>
  <text x="60" y="475" font-size="13" fill="#495057" font-weight="bold">Guarantees</text>
  <text x="60" y="497" font-size="12" fill="#495057">• at-least-once delivery (idempotency keys)</text>
  <text x="60" y="515" font-size="12" fill="#495057">• survives process kill, OS restart, no network</text>
  <text x="60" y="533" font-size="12" fill="#495057">• optimistic UI is safe — write is committed</text>

</svg>
